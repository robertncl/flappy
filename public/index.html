<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flappy Runs</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
        background: radial-gradient(circle at 50% 30%, #141a33, #0b0e1a 70%);
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        color-scheme: dark;
      }
      main {
        display: grid;
        justify-items: center;
        gap: 10px;
      }
      canvas {
        /* Leave room for the controls bar below. */
        height: min(calc(96vh - 44px), 128vw);
        aspect-ratio: 3 / 4;
        border-radius: 10px;
        box-shadow: 0 12px 48px rgba(0, 0, 0, 0.55);
        touch-action: none;
        user-select: none;
        cursor: pointer;
      }
      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 8px 20px;
        color: #cfe3ff;
        font-size: 15px;
        font-weight: 600;
      }
      .difficulty,
      .language {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .language {
        gap: 8px;
      }
      .difficulty input {
        width: 150px;
        margin: 0;
        accent-color: #ffd34e;
        cursor: pointer;
      }
      .difficulty output {
        min-width: 4.5em;
        color: #ffd34e;
      }
      .language select {
        font: inherit;
        color: #ffd34e;
        background: #141a33;
        border: 1px solid #3a4470;
        border-radius: 6px;
        padding: 3px 6px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <canvas id="game" width="480" height="640" role="img" aria-label="Flappy Runs — a Flappy Bird style game with 15 levels">
        Flappy Runs is a canvas game and needs JavaScript to run.
      </canvas>
      <div class="controls">
        <label class="difficulty">
          <span id="difficulty-label">Difficulty</span>
          <input id="difficulty" type="range" min="0" max="4" step="1" value="2" />
          <output id="difficulty-name" for="difficulty">Normal</output>
        </label>
        <label class="language">
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="9" />
            <path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9s1.3-6.4 3.8-9z" />
          </svg>
          <select id="language" aria-label="Language"></select>
        </label>
      </div>
    </main>
    <script type="module" src="../src/client.ts"></script>
  </body>
</html>
